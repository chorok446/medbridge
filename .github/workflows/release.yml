name: Release (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v9.0.0

      - name: 버전 일치 검증
        shell: bash
        run: python3 scripts/check-versions.py

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Updater signing secret 존재 확인
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY / TAURI_UPDATER_PUBKEY secret이 없습니다. docs/release/windows-release-process.md 참조."
            exit 1
          fi

      - name: 릴리스 게이트 — 버전 증가·중복 확인
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LATEST=$(gh release list --repo chorok446/medbridge-releases --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          echo "latest=$LATEST current=$VERSION"
          if [ "$LATEST" = "$VERSION" ]; then
            echo "::notice::버전($VERSION)이 최신 릴리스와 같습니다. 릴리스를 건너뜁니다."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::버전($VERSION)이 최신 릴리스($LATEST)보다 낮습니다."
            exit 1
          fi
          if gh release view "v$VERSION" --repo chorok446/medbridge-releases > /dev/null 2>&1; then
            echo "::error::v$VERSION 릴리스가 이미 존재합니다."
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Frontend checks + build
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Backend checks
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/api
        run: |
          uv sync
          uv run ruff check .
          uv run pytest -q

      - name: OCR 리소스 준비
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/fetch-ocr-resources.py
      - name: Build sidecar exe
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/api
        run: uv run pyinstaller sidecar.spec

      - name: Place sidecar for Tauri
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/api/dist/medbridge-sidecar.exe \
            apps/desktop/src-tauri/binaries/medbridge-sidecar-x86_64-pc-windows-msvc.exe

      - name: Inject updater public key
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          python - <<'EOF'
          import json, os
          p = 'apps/desktop/src-tauri/tauri.conf.json'
          conf = json.load(open(p, encoding='utf-8'))
          conf['plugins']['updater']['pubkey'] = os.environ['TAURI_UPDATER_PUBKEY']
          json.dump(conf, open(p, 'w', encoding='utf-8'), indent=2)
          EOF

      - name: Tauri build (NSIS + updater 서명)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install
          pnpm tauri build

      - name: Compose latest.json
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle/nsis"
          SIG_FILE=$(ls "$BUNDLE_DIR"/*.sig | head -1)
          PKG_FILE=$(basename "$(ls "$BUNDLE_DIR"/*.exe | head -1)")
          python - "$VERSION" "$SIG_FILE" "$PKG_FILE" <<'EOF'
          import datetime
          import json
          import sys

          version, sig_path, pkg_name = sys.argv[1:4]
          latest = {
              "version": version,
              "notes": f"MedBridge Study {version} 업데이트",
              "pub_date": datetime.datetime.now(datetime.UTC)
              .isoformat()
              .replace("+00:00", "Z"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": open(sig_path, encoding="utf-8").read(),
                      "url": (
                          "https://github.com/chorok446/medbridge-releases/"
                          f"releases/download/v{version}/{pkg_name}"
                      ),
                  }
              },
          }
          json.dump(latest, open("latest.json", "w", encoding="utf-8"), indent=2)
          EOF

      - name: Publish to public releases repo
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle/nsis"
          gh release create "v$VERSION" \
            --repo chorok446/medbridge-releases \
            --title "MedBridge Study v$VERSION" \
            --notes "MedBridge Study v$VERSION — 자세한 변경 내용은 앱의 업데이트 안내를 확인하세요." \
            "$BUNDLE_DIR"/*.exe \
            "$BUNDLE_DIR"/*.sig \
            latest.json
