name: CI (Windows 검증)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 버전 일치 검증
        run: python3 scripts/check-versions.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy app
      - name: Tests (외부 인프라 불필요)
        run: uv run pytest -q
      - name: SQLite migration cycle
        env:
          MEDBRIDGE_APP_DATA_DIR: /tmp/medbridge-ci
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Static export build
        run: pnpm build

  # Windows 빌드 검증 — Release는 생성하지 않고 artifact만 업로드한다
  windows-build:
    runs-on: windows-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Frontend build (static export)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Backend tests (Windows)
        working-directory: apps/api
        run: |
          uv sync
          uv run pytest -q
      - name: OCR 리소스 준비 (버전·checksum 고정)
        run: python scripts/fetch-ocr-resources.py
      - name: Sidecar exe build
        working-directory: apps/api
        run: uv run pyinstaller sidecar.spec
      - name: Sidecar smoke test (Windows 실행 확인)
        shell: bash
        working-directory: apps/api
        run: |
          ./dist/medbridge-sidecar.exe --host 127.0.0.1 --port 18900 &
          SIDECAR_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18900/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18900/health
          kill $SIDECAR_PID || true
      - name: OCR 스모크 테스트 (번들 리소스로 한국어·영어 인식)
        shell: bash
        working-directory: apps/api
        env:
          MEDBRIDGE_OCR_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/resources/ocr
        run: uv run pytest tests/integration/test_ocr_flow.py -q
      - name: Place sidecar for Tauri
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/api/dist/medbridge-sidecar.exe \
            apps/desktop/src-tauri/binaries/medbridge-sidecar-x86_64-pc-windows-msvc.exe
      - name: Tauri Windows build (NSIS, 서명 없음)
        working-directory: apps/desktop
        run: |
          pnpm install
          pnpm tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: medbridge-windows-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
