name: CI (Windows 검증)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    # 기본값은 opened·synchronize·reopened뿐이라, draft로 열어 두고 작업하다
    # "Ready for review"로 바꾸면 그 시점에 CI가 돌지 않는다. 마지막 push 이후
    # 아무 검증 없이 리뷰에 들어가게 되므로 그 전환도 트리거로 잡는다.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 같은 PR에 연달아 push하면 이전 실행은 이미 낡은 커밋을 검증하는 중이다. PR에서만
# 취소한다 — develop push는 각 커밋이 독립적인 검증 기록이라 끝까지 돌린다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 이 워크플로는 저장소를 읽기만 한다(artifact 업로드는 별도 권한).
permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 버전 일치 검증
        id: check
        run: |
          set +e
          python3 scripts/check-versions.py | tee versions.log
          status=${PIPESTATUS[0]}
          echo "result=$(tail -1 versions.log)" >> "$GITHUB_OUTPUT"
          exit $status
      - name: 실행 요약
        if: always()
        env:
          CI_SUMMARY_ICON: 🔖
          CI_SUMMARY_TITLE: 버전 일치
          CI_SUMMARY_ROWS: |
            구성요소 버전 일치|${{ steps.check.outcome }}|${{ steps.check.outputs.result }}
        run: python3 scripts/ci_summary.py

  backend:
    runs-on: ubuntu-latest
    # 정상 소요는 2분 안쪽이다. 러너가 통신 두절로 죽으면 로그가 통째로 사라지므로
    # (실측: Tests 단계 45분 정지 후 로그 미업로드) 기본 6시간을 기다리지 않는다.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        id: lint
        run: uv run ruff check .
      - name: Typecheck
        id: typecheck
        run: uv run mypy app
      - name: Tests (외부 인프라 불필요)
        id: tests
        run: |
          set +e
          uv run pytest -q | tee pytest.log
          status=${PIPESTATUS[0]}
          # 실패해도 요약에 숫자를 남긴다 — 몇 개가 깨졌는지가 첫 단서다.
          echo "result=$(grep -E 'passed|failed|error|no tests ran' pytest.log | tail -1)" \
            >> "$GITHUB_OUTPUT"
          exit $status
      - name: SQLite migration cycle
        id: migration
        env:
          MEDBRIDGE_APP_DATA_DIR: /tmp/medbridge-ci
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: 실행 요약
        if: always()
        # 값은 env로만 넘긴다. 테스트 출력을 셸 인자로 보간하면 그 안의 문자가 명령으로
        # 해석될 수 있다(fork PR이 테스트 이름으로 주입할 수 있는 실제 경로다).
        env:
          CI_SUMMARY_ICON: 🐍
          CI_SUMMARY_TITLE: 백엔드 (ubuntu-latest)
          CI_SUMMARY_ROWS: |
            Lint (ruff)|${{ steps.lint.outcome }}|
            Typecheck (mypy)|${{ steps.typecheck.outcome }}|
            테스트 (pytest)|${{ steps.tests.outcome }}|${{ steps.tests.outputs.result }}
            SQLite 마이그레이션 왕복|${{ steps.migration.outcome }}|
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_summary.py"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck
      - name: Tests
        id: tests
        run: |
          set +e
          pnpm test 2>&1 | sed -r 's/\x1b\[[0-9;]*m//g' | tee vitest.log
          status=${PIPESTATUS[0]}
          echo "result=$(grep -E '^\s*Tests +[0-9]' vitest.log | tail -1 | xargs)" \
            >> "$GITHUB_OUTPUT"
          exit $status
      - name: Static export build
        id: build
        run: pnpm build
      - name: 실행 요약
        if: always()
        env:
          CI_SUMMARY_ICON: 🌐
          CI_SUMMARY_TITLE: 프런트엔드 (ubuntu-latest)
          CI_SUMMARY_ROWS: |
            Lint (eslint)|${{ steps.lint.outcome }}|
            Typecheck (tsc)|${{ steps.typecheck.outcome }}|
            테스트 (vitest)|${{ steps.tests.outcome }}|${{ steps.tests.outputs.result }}
            정적 export 빌드|${{ steps.build.outcome }}|
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_summary.py"

  # 의존성 취약점 스캔.
  #
  # **비차단으로 시작한다.** 지금 이미 JS 쪽 high 7건, Python 쪽 2건(pypdf)이 잡히므로
  # 차단형으로 넣으면 첫날부터 모든 PR이 빨간불이 되고, 그러면 사람들은 CI를 읽지 않게
  # 된다. 리포트를 먼저 쌓아 무엇이 실제로 우리에게 닿는 취약점인지 가려낸 뒤 차단으로
  # 올린다.
  #
  # 이 앱은 사용자 PC에서 임의의 PDF를 연다 — 파서 취약점이 곧 공격면이라 리포트만으로도
  # 값어치가 있다(첫 실행에서 pypdf 6.14.2의 GHSA 2건이 걸렸다).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: JS 의존성 스캔 (pnpm audit, high 이상)
        id: jsaudit
        continue-on-error: true
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          set +e
          pnpm audit --audit-level=high 2>&1 | sed -r 's/\x1b\[[0-9;]*m//g' | tee audit.log
          status=${PIPESTATUS[0]}
          echo "result=$(grep -E '^[0-9]+ vulnerabilit' audit.log | tail -1)" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Python 의존성 스캔 (pip-audit)
        id: pyaudit
        continue-on-error: true
        working-directory: apps/api
        run: |
          # 잠금 파일을 그대로 감사한다 — 설치된 환경이 아니라 우리가 고정한 버전이
          # 검사 대상이어야 한다. --no-emit-project: 우리 패키지 자체는 PyPI에 없다.
          uv export --locked --format requirements-txt --no-dev --no-emit-project > requirements-audit.txt
          set +e
          uvx pip-audit@2.9.0 -r requirements-audit.txt --progress-spinner off 2>&1 | tee pipaudit.log
          status=${PIPESTATUS[0]}
          echo "result=$(grep -E 'known vulnerabilit|No known vulnerabilities' pipaudit.log | tail -1)" \
            >> "$GITHUB_OUTPUT"
          exit $status
      - name: 실행 요약
        if: always()
        env:
          CI_SUMMARY_ICON: 🔒
          CI_SUMMARY_TITLE: 의존성 보안 스캔 (비차단)
          CI_SUMMARY_ROWS: |
            JS (pnpm audit)|${{ steps.jsaudit.outcome }}|${{ steps.jsaudit.outputs.result }}
            Python (pip-audit)|${{ steps.pyaudit.outcome }}|${{ steps.pyaudit.outputs.result }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_summary.py"

  # Windows 빌드 검증 — Release는 생성하지 않고 artifact만 업로드한다
  windows-build:
    runs-on: windows-latest
    # Windows 러너는 분당 과금이 Linux의 2배이고 이 잡만 15분을 넘는다. lint·테스트가
    # 이미 깨진 커밋에 그 시간을 쓰지 않는다(대신 시작이 1~2분 늦어진다).
    needs: [versions, backend, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Tauri release 빌드는 의존 crate를 매번 처음부터 컴파일한다 — 이 잡 소요의 대부분이다.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Frontend build (static export)
        id: fe
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Backend tests (Windows)
        id: betests
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run pytest -q
      - name: OCR 리소스 준비 (버전·checksum 고정)
        id: ocrfetch
        run: python scripts/fetch-ocr-resources.py
      - name: Sidecar exe build
        id: sidecar
        working-directory: apps/api
        run: uv run pyinstaller sidecar.spec
      - name: Sidecar smoke test (Windows 실행 확인)
        id: smoke
        shell: bash
        working-directory: apps/api
        run: |
          ./dist/medbridge-sidecar.exe --host 127.0.0.1 --port 18900 &
          SIDECAR_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18900/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18900/health
          kill $SIDECAR_PID || true
      - name: OCR 스모크 테스트 (번들 리소스로 한국어·영어 인식)
        id: ocrsmoke
        shell: bash
        working-directory: apps/api
        env:
          MEDBRIDGE_OCR_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/resources/ocr
        run: uv run pytest tests/integration/test_ocr_flow.py -q
      - name: Place sidecar for Tauri
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/api/dist/medbridge-sidecar.exe \
            apps/desktop/src-tauri/binaries/medbridge-sidecar-x86_64-pc-windows-msvc.exe
      - name: Rust format
        id: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Rust check (locked)
        id: rustcheck
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Rust tests (locked)
        id: rusttests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Rust clippy (locked)
        id: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tauri Windows build (NSIS, 서명 없음 — CI 전용 임시 키로 발급 통과)
        id: tauri
        shell: bash
        working-directory: apps/desktop
        run: |
          # 상대 경로 사용: /tmp는 Windows 러너의 MSYS bash에서 경로 변환이
          # 어긋나 tauri CLI가 쓴 파일을 못 읽는 경우가 있다.
          pnpm tauri signer generate --ci -w ci-signing-key -p ""
          # tauri.conf.json의 pubkey는 release.yml이 실제 Secrets로 채우는
          # placeholder다. CI 빌드는 방금 만든 임시 키쌍의 공개키로 맞바꿔야
          # updater 아티팩트 서명 검증(base64 디코딩)이 통과한다.
          python3 - "$(cat ci-signing-key.pub)" <<'EOF'
          import json, sys
          p = "src-tauri/tauri.conf.json"
          conf = json.load(open(p, encoding="utf-8"))
          conf["plugins"]["updater"]["pubkey"] = sys.argv[1]
          json.dump(conf, open(p, "w", encoding="utf-8"), indent=2)
          EOF
          export TAURI_SIGNING_PRIVATE_KEY="$(cat ci-signing-key)"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          pnpm install --frozen-lockfile
          pnpm tauri build -- --locked
          rm -f ci-signing-key ci-signing-key.pub
      - name: Windows 실기기 검증 키트 및 provenance manifest 생성
        id: testkit
        shell: bash
        working-directory: apps/api
        run: |
          uv run python ../../scripts/generate-windows-test-kit.py
          cd ../..
          INSTALLERS=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [[ ${#INSTALLERS[@]} -ne 1 || ! -f "${INSTALLERS[0]}" ]]; then
            echo "::error::NSIS installer가 정확히 1개여야 합니다. 발견: ${#INSTALLERS[@]}"
            exit 1
          fi
          python3 scripts/build-windows-test-kit-bundle.py \
            --installer "${INSTALLERS[0]}" \
            --kit-dir docs/testing/windows-test-kit \
            --output artifacts/windows-setup \
            --tested-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: medbridge-windows-setup
          path: artifacts/windows-setup/
          retention-days: 30

      - name: 실행 요약
        if: always()
        shell: bash
        env:
          FE: ${{ steps.fe.outcome }}
          BETESTS: ${{ steps.betests.outcome }}
          OCRFETCH: ${{ steps.ocrfetch.outcome }}
          SIDECAR: ${{ steps.sidecar.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          OCRSMOKE: ${{ steps.ocrsmoke.outcome }}
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          RUSTCHECK: ${{ steps.rustcheck.outcome }}
          RUSTTESTS: ${{ steps.rusttests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TAURI: ${{ steps.tauri.outcome }}
          TESTKIT: ${{ steps.testkit.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          CI_SUMMARY_ICON: 🪟
          CI_SUMMARY_TITLE: Windows 빌드 (windows-latest)
        run: |
          # 산출물 크기까지 남긴다 — 빌드가 "성공"인데 설치 파일이 비어 있는 경우를
          # 로그를 열지 않고도 알아채기 위한 것이다.
          describe() {
            local f
            f=$(ls $1 2>/dev/null | head -1) || true
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "$(basename "$f") ($(du -h "$f" | cut -f1))"
            else
              echo ""
            fi
          }
          SIDECAR_INFO=$(describe "apps/api/dist/medbridge-sidecar.exe")
          INSTALLER_INFO=$(describe "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")
          export CI_SUMMARY_ROWS="프런트엔드 정적 빌드|$FE|
          백엔드 테스트 (Windows)|$BETESTS|
          OCR 리소스 준비|$OCRFETCH|
          Sidecar exe 빌드|$SIDECAR|$SIDECAR_INFO
          Sidecar 기동 확인|$SMOKE|
          OCR 스모크 (한국어·영어)|$OCRSMOKE|
          Rust 형식 검사|$RUSTFMT|
          Rust 컴파일 검사 (locked)|$RUSTCHECK|
          Rust 테스트 (locked)|$RUSTTESTS|
          Rust clippy (locked)|$CLIPPY|
          Tauri NSIS 빌드|$TAURI|$INSTALLER_INFO
          검증 키트 + provenance manifest|$TESTKIT|
          설치 파일 업로드|$UPLOAD|"
          python "$GITHUB_WORKSPACE/scripts/ci_summary.py"

  # 잡 4개의 결과를 한 표로 모은다. 개별 잡 요약은 각자의 섹션에 흩어져 있어, 실행을
  # 열자마자 "무엇이 깨졌나"를 보려면 종합이 하나 필요하다.
  summary:
    if: always()
    # security는 비차단이라 잡 결과가 항상 success다(단계에 continue-on-error).
    # 종합 표에는 실려야 하므로 needs에 넣되, 이 때문에 전체가 빨개지지는 않는다.
    needs: [versions, backend, frontend, security, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 전체 결과
        env:
          CI_SUMMARY_ICON: 📋
          CI_SUMMARY_TITLE: 전체 결과
          CI_SUMMARY_COLUMN: 잡
          CI_SUMMARY_ROWS: |
            버전 일치|${{ needs.versions.result }}|
            백엔드 (ubuntu)|${{ needs.backend.result }}|
            프런트엔드 (ubuntu)|${{ needs.frontend.result }}|
            의존성 보안 스캔|${{ needs.security.result }}|비차단 — 표는 위 섹션 참고
            Windows 빌드|${{ needs['windows-build'].result }}|
        run: python3 scripts/ci_summary.py
      - name: 실패한 잡이 있으면 이 잡도 실패시킨다
        # 종합이 초록인데 아래 잡이 빨간 상태는 훑어보는 사람을 오도한다.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::하나 이상의 잡이 실패·취소되었습니다. 위 '전체 결과' 표를 확인하세요."
          exit 1
