# 로컬 개발용 전체 스택.
# 주의(외장 SSD): postgres/minio/redis 데이터는 bind mount가 아닌 named volume을 쓴다.
# /Volumes/extssd 아래에 DB 데이터를 직접 두면 권한·성능·소켓 문제가 생길 수 있다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medbridge
      POSTGRES_PASSWORD: medbridge
      POSTGRES_DB: medbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medbridge
      MINIO_ROOT_PASSWORD: medbridge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 medbridge medbridge-secret &&
      mc mb --ignore-existing local/medbridge-originals &&
      mc mb --ignore-existing local/medbridge-redacted &&
      mc mb --ignore-existing local/medbridge-derived &&
      mc anonymous set none local/medbridge-originals &&
      mc anonymous set none local/medbridge-redacted &&
      mc anonymous set none local/medbridge-derived
      "

  api:
    build:
      context: apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medbridge:medbridge@postgres:5432/medbridge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medbridge:medbridge@postgres:5432/medbridge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: dramatiq app.workers.tasks --processes 1 --threads 4
    healthcheck:
      # worker 프로세스 생존 확인 (broker 연결은 기동 시 실패하면 프로세스가 죽는다)
      test: ["CMD-SHELL", "pgrep -f 'dramatiq' > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://medbridge:medbridge@postgres:5432/medbridge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    profiles: ["tools"]

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
