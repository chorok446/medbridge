<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="docShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#0c2461" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#glow)"/>

  <!-- document sheet with folded corner -->
  <g filter="url(#docShadow)">
    <path d="M 296 152
             h 300
             l 136 136
             v 424
             a 36 36 0 0 1 -36 36
             h -400
             a 36 36 0 0 1 -36 -36
             v -524
             a 36 36 0 0 1 36 -36 z"
          fill="#ffffff"/>
    <path d="M 596 152 l 136 136 h -112 a 24 24 0 0 1 -24 -24 z" fill="url(#fold)"/>
  </g>

  <!-- text lines -->
  <g stroke-linecap="round">
    <line x1="356" y1="298" x2="540" y2="298" stroke="#93a8c9" stroke-width="30"/>
    <line x1="356" y1="374" x2="668" y2="374" stroke="#c3d0e4" stroke-width="30"/>
    <!-- evidence highlight line -->
    <rect x="340" y="428" width="344" height="62" rx="31" fill="#dbeafe"/>
    <line x1="372" y1="459" x2="652" y2="459" stroke="#2563eb" stroke-width="30" stroke-linecap="round"/>
    <line x1="356" y1="536" x2="668" y2="536" stroke="#c3d0e4" stroke-width="30"/>
    <line x1="356" y1="612" x2="560" y2="612" stroke="#c3d0e4" stroke-width="30"/>
  </g>

  <!-- through-arch bridge: arch ends meet the deck, hangers drop to the deck -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round">
    <path d="M 176 856 Q 512 648 848 856" stroke-width="42"/>
    <line x1="128" y1="856" x2="896" y2="856" stroke-width="42"/>
    <line x1="336" y1="774" x2="336" y2="856" stroke-width="24"/>
    <line x1="512" y1="752" x2="512" y2="856" stroke-width="24"/>
    <line x1="688" y1="774" x2="688" y2="856" stroke-width="24"/>
  </g>
</svg>
