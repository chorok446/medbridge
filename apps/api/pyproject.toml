[project]
name = "medbridge-api"
version = "0.1.0"
description = "MedBridge Study desktop sidecar (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "platformdirs>=4.2",
    # 6.15.0은 GHSA-jp53-mhqp-8xcg, GHSA-23w6-3w8w-8484,
    # GHSA-763m-79hh-57f2의 영향권이다.
    # 임의 PDF를 여는 앱이므로 세 권고가 모두 수정된 6.16.2 이상을 쓴다.
    "pypdf>=6.16.2",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "pymupdf==1.26.*",
    "keyring>=25.2",
    # Windows Credential Manager 백엔드 의존성 (keyring이 사용). 다른 OS에선 설치 안 함.
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[tool.uv]
# 우리가 import하지 않는 transitive의 하한을 올린다. 직접 의존성으로 만들면
# "이 앱이 쓰는 것"과 "취약해서 붙잡아 둔 것"이 뒤섞인다.
#
# cryptography: keyring -> secretstorage(리눅스 키링 백엔드) -> cryptography.
# 49.0.0에 PYSEC-2026-3552가 있다. 이 경로는 sys_platform == 'linux'에서만 살아
# 있고 배포 대상은 Windows라 사용자에게 닿지 않지만, CI가 리눅스에서 돌아 스캔에
# 잡힌다 — 남겨두면 진짜 문제가 이 잡음에 묻힌다.
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# 멈춘 테스트는 스택을 남기고 죽어야 한다. CI에서 Tests 단계가 45분 정지한 뒤 러너가
# 통신 두절로 죽어 로그가 통째로 사라진 적이 있다 — 그때 원인을 좁힐 단서가 0이었다.
# 전체 스위트가 45초, 가장 느린 테스트가 4초이므로 300초는 오탐이 날 여지가 없다.
# thread 방식은 signal(POSIX 전용)과 달리 Windows·Linux에서 같게 동작한다.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    # SWIG 바인딩(C 확장)이 내부 타입에 __module__을 안 붙여 나는 서드파티 경고 — 무해.
    "ignore:builtin type SwigPy.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() 기본값 패턴

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 테스트 env를 import보다 먼저 주입해야 한다

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
