[project]
name = "medbridge-api"
version = "0.1.0"
description = "MedBridge Study desktop sidecar (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "platformdirs>=4.2",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "pymupdf==1.26.*",
    "keyring>=25.2",
    # Windows Credential Manager 백엔드 의존성 (keyring이 사용). 다른 OS에선 설치 안 함.
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() 기본값 패턴

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # 테스트 env를 import보다 먼저 주입해야 한다

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
