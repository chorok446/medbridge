<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">

<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#0D9488"/>
  </linearGradient>
</defs>

<rect width="1400" height="900" fill="#F8FAFC"/>
<text x="90" y="92" font-family="Inter, Pretendard, Arial, sans-serif" font-size="24" font-weight="700" fill="#64748B" letter-spacing="2">MEDBRIDGE STUDY — CONCEPT 1</text>

<!-- Main lockup -->
<g transform="translate(105,205)">
  <g filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="260" rx="64" fill="url(#blueTeal)"/>
    <!-- bridge towers -->
    <rect x="54" y="58" width="34" height="142" rx="17" fill="#FFFFFF"/>
    <rect x="172" y="58" width="34" height="142" rx="17" fill="#FFFFFF"/>
    <!-- bridge arch/deck -->
    <path d="M71 132 C94 78, 166 78, 189 132" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <path d="M72 174 H188" fill="none" stroke="#CCFBF1" stroke-width="18" stroke-linecap="round"/>
    <!-- cross -->
    <rect x="121" y="124" width="18" height="55" rx="9" fill="#0F766E"/>
    <rect x="103" y="142" width="54" height="18" rx="9" fill="#0F766E"/>
  </g>

  <text x="320" y="108" font-family="Inter, Pretendard, Arial, sans-serif" font-size="84" font-weight="750" fill="#0F172A">MedBridge</text>
  <text x="325" y="164" font-family="Inter, Pretendard, Arial, sans-serif" font-size="30" font-weight="650" fill="#2563EB" letter-spacing="8">STUDY</text>
  <text x="325" y="216" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="25" fill="#64748B">의학 지식과 학습자를 연결하는 개인 학습 도구</text>
</g>

<!-- Icon scale tests -->
<g transform="translate(105,610)">
  <text x="0" y="-34" font-family="Inter, Arial" font-size="22" font-weight="700" fill="#334155">APP ICON SCALE</text>
  <g transform="translate(0,0)">
    <rect width="150" height="150" rx="38" fill="url(#blueTeal)"/>
    <rect x="31" y="32" width="20" height="84" rx="10" fill="white"/>
    <rect x="99" y="32" width="20" height="84" rx="10" fill="white"/>
    <path d="M41 74 C54 42,96 42,109 74" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M42 99 H108" fill="none" stroke="#CCFBF1" stroke-width="11" stroke-linecap="round"/>
    <rect x="70" y="70" width="10" height="34" rx="5" fill="#0F766E"/>
    <rect x="58" y="82" width="34" height="10" rx="5" fill="#0F766E"/>
  </g>
  <g transform="translate(190,38)">
    <rect width="76" height="76" rx="19" fill="url(#blueTeal)"/>
    <rect x="16" y="16" width="10" height="44" rx="5" fill="white"/>
    <rect x="50" y="16" width="10" height="44" rx="5" fill="white"/>
    <path d="M21 38 C28 21,48 21,55 38" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 51 H54" fill="none" stroke="#CCFBF1" stroke-width="6" stroke-linecap="round"/>
    <rect x="35" y="36" width="6" height="18" rx="3" fill="#0F766E"/>
    <rect x="29" y="42" width="18" height="6" rx="3" fill="#0F766E"/>
  </g>
  <g transform="translate(305,58)">
    <rect width="40" height="40" rx="10" fill="url(#blueTeal)"/>
    <path d="M11 27 V12 M29 27 V12 M11 20 C15 10,25 10,29 20 M12 26 H28" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</g>

<!-- Palette -->
<g transform="translate(770,635)">
  <text x="0" y="-34" font-family="Inter, Arial" font-size="22" font-weight="700" fill="#334155">PALETTE</text>
  <circle cx="28" cy="28" r="28" fill="#2563EB"/><text x="70" y="36" font-family="Inter, Arial" font-size="20" fill="#475569">Trust Blue</text>
  <circle cx="28" cy="100" r="28" fill="#0D9488"/><text x="70" y="108" font-family="Inter, Arial" font-size="20" fill="#475569">Clinical Teal</text>
  <circle cx="300" cy="28" r="28" fill="#0F172A"/><text x="342" y="36" font-family="Inter, Arial" font-size="20" fill="#475569">Slate Ink</text>
</g>
</svg>